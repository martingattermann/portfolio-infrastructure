---
- name: Create Nginx Exporter system group
  group:
    name: nginx_exporter
    state: present
    system: yes

- name: Create Nginx Exporter system user
  user:
    name: nginx_exporter
    system: yes
    shell: "/sbin/nologin"
    group: nginx_exporter
    create_home: no

- name: Download Nginx Exporter
  get_url:
    url: "https://github.com/nginxinc/nginx-prometheus-exporter/releases/download/v0.11.0/nginx-prometheus-exporter_0.11.0_linux_amd64.tar.gz"
    dest: "/tmp/nginx_exporter.tar.gz"
    mode: '0644'

- name: Extract Nginx Exporter binary
  unarchive:
    src: "/tmp/nginx_exporter.tar.gz"
    dest: "/tmp"
    remote_src: yes

- name: Move Nginx Exporter binary to /usr/local/bin
  copy:
    src: "/tmp/nginx-prometheus-exporter"
    dest: "/usr/local/bin/nginx-prometheus-exporter"
    owner: nginx_exporter
    group: nginx_exporter
    mode: '0755'
    remote_src: yes

- name: Create Nginx Exporter systemd service
  template:
    src: "nginx_exporter.service.j2"
    dest: /etc/systemd/system/nginx-exporter.service
    mode: '0644'

- name: Start and enable Nginx Exporter service
  systemd:
    name: nginx-exporter
    state: started
    enabled: yes
    daemon_reload: yes

- name: Reload nginx
  systemd:
    name: nginx
    state: reloaded
    enabled: yes