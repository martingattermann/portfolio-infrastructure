---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Copy Nginx configuration file
  template:
    src: "../templates/nginx.conf.j2"
    dest: /etc/nginx/nginx.conf
    mode: '0644'
  notify: restart nginx

- name: Ensure Nginx is enabled and running
  service:
    name: nginx
    state: started
    enabled: yes

- name: delete default site
  file: 
    path: /var/www/html/
    state: absent

- name: create web directory
  file: 
    path: /var/www/html
    state: directory

- name: copy webpage from github repo to host
  git:
    repo: https://github.com/cloudacademy/static-website-example
    dest: /var/www/html
    force: yes